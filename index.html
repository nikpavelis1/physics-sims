<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Putney Physics Simulations</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#5f6b7f;--line:#dde2ec;--accent:#2f6fde}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(135deg,#1d2433,#2f4f8f);color:#fff;padding:28px 22px 24px}
  header h1{margin:0 0 6px;font-size:28px}
  header p{margin:0;opacity:.85;font-size:15px}
  main{max-width:1100px;margin:0 auto;padding:20px 18px 40px}
  .search{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;margin-bottom:18px}
  h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
  .icon{font-size:30px}
  .card h3{margin:0;font-size:18px}
  .card p{margin:0;font-size:14px;color:var(--muted);line-height:1.4;flex:1}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;background:#eef2fb;color:#2f4f8f;border-radius:20px;padding:3px 9px}
  .open{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:12px;border-radius:10px;margin-top:4px}
  .open:active{transform:scale(.98)}
  .none{display:none;color:var(--muted);font-size:15px}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 0 30px}
</style>
</head>
<body>
<header>
  <h1>⚛️ Putney Physics Simulations</h1>
  <p>Tap a button to open a simulation.</p>
</header>
<main>
  <input class="search" id="search" type="search" placeholder="Search simulations (e.g. transformer, induction)">
  <div id="list"></div>
  <p class="none" id="none">No simulations match your search.</p>
</main>
<footer>Mr Pavelis · Putney High School Physics</footer>

<script>
// ===== To add a new simulation: upload its .html file to the repo, then add one line here. =====
const SIMS = [
  { topic:'Electromagnetic induction', icon:'🧲', title:'Magnet into a Solenoid',
    file:'Magnet_into_Solenoid.html', level:'GCSE',
    desc:'Push a magnet in and out of a coil and see when a pd is induced and which way the current flows.' },
  { topic:'Electromagnetic induction', icon:'✂️', title:'Cutting Field Lines',
    file:'Cutting_Field_Lines.html', level:'GCSE',
    desc:'Move a wire through a magnetic field and see how cutting field lines induces a potential difference.' },
  { topic:'Electromagnetic induction', icon:'🔄', title:'Why Does the Alternator Slow Down?',
    file:'Lenz_Alternator_Steps.html', level:'GCSE',
    desc:'Step by step: the coil cuts the field lines, a current flows, the temporary field pushes back. Lenz\'s law.' },
  { topic:'Transformers', icon:'⚡', title:'Transformer Lab',
    file:'Transformer_Lab.html', level:'GCSE',
    desc:'Change the turns on each coil and watch the alternating field link the primary to the secondary.' },
];

const list=document.getElementById('list'), none=document.getElementById('none');
function render(q=''){
  q=q.trim().toLowerCase();
  const shown=SIMS.filter(s=>!q || (s.title+' '+s.topic+' '+s.desc+' '+s.level).toLowerCase().includes(q));
  const topics=[...new Set(shown.map(s=>s.topic))];
  list.innerHTML=topics.map(t=>`<h2>${t}</h2><div class="grid">`+shown.filter(s=>s.topic===t).map(s=>`
    <div class="card">
      <div class="icon">${s.icon}</div>
      <h3>${s.title}</h3>
      <div class="tags"><span class="tag">${s.level}</span></div>
      <p>${s.desc}</p>
      <a class="open" href="${s.file}">Open simulation ▶</a>
    </div>`).join('')+`</div>`).join('');
  none.style.display=shown.length?'none':'block';
}
document.getElementById('search').addEventListener('input',e=>render(e.target.value));
render();
</script>
</body>
</html>
